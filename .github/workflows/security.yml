name: Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Run npm audit in server
      run: |
        cd server
        npm audit --audit-level=high || echo "High vulnerabilities found, check logs!"
        
    - name: Run npm audit in client
      run: |
        cd client
        npm audit --audit-level=high || echo "High vulnerabilities found, check logs!"
